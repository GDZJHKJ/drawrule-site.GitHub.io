name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天北京时间 21:00-22:55，每 5 分钟尝试同步一次开奖结果（开奖约 21:25）
    - cron: "*/5 13-14 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 定时/手动触发时，先抓官方开奖结果，有变化就提交
  sync:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 抓取最新开奖（官方 → 500.com 镜像，含重叠期校验）
        run: node scripts/fetch-draws.mjs
      - name: 有变化则提交
        id: commit
        run: |
          if git diff --quiet -- public/data/draws.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo ">>> 数据未变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/draws.json
          git commit -m "chore(data): sync 排列五开奖数据 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    if: |
      always() && !cancelled() && (
        github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && !contains(github.event.head_commit.message, 'chore(data)'))
        || (github.event_name == 'schedule' && needs.sync.outputs.changed == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
